    <!--
      Super admin paneli begona ramka ichida ochilmasligi kerak.
      GitHub Pages HTTP sarlavha qo'ya olmaydi, shuning uchun himoya
      shu yerda: sahifa ramkada bo'lsa o'zini tashqariga chiqaradi,
      chiqib bo'lmasa umuman ko'rsatmaydi.
    -->
    <script>
      try {
        if (self !== top) top.location.replace(self.location.href);
      } catch (e) {
        document.documentElement.style.display = 'none';
      }
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
